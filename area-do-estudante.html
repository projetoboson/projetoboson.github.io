<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login-contato.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <body class="area-do-estudante">
  <div class="glass-container">
    <div class="icone-login">
      <img src="./icones.img/icone-escola.png" width="100px" >
      <h2>LOGIN</h2>
    </div>

    <form>
      <div class="input-group">
        <input type="text" required>
        <label>Matrícula</label>
      </div>

      <div class="input-group">
        <input type="password" required>
        <label>Senha</label>
      </div>

      <div class="remember-forgot">
        <label><input type="checkbox">Remember-me</label>
        <a href="#">Esqueceu sua senha?</a>
      </div>

      <button type="submit" class="login-btn">Log In</button>
      <div class="register-link">
      <p>Não possui uma conta? <a href="#">Registre-se</a></p>
    </div>

    </form>
  </div>
</body>
</html>
